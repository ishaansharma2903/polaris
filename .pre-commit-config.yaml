# pip install pre-commit && pre-commit install
# Runs automatically on every `git commit`; catches style/type issues before
# they ever reach CI - faster feedback loop than waiting for GitHub Actions.

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.11.2
    hooks:
      - id: mypy
        additional_dependencies: [numpy, types-requests]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: [--maxkb=500]  # kernels/meshes/data belong in Releases or a data repo, not git history
      - id: check-merge-conflict
      - id: debug-statements  # catches stray print()/pdb.set_trace()

  - repo: https://github.com/kynan/nbstripout
    rev: 0.7.1
    hooks:
      - id: nbstripout  # strips notebook output/execution-count noise from diffs

  - repo: https://github.com/opensource-nepal/commitlint
    rev: v2.0.0
    hooks:
      - id: commitlint
        stages: [commit-msg]
