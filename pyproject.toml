[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "polaris"
version = "0.1.0.dev1"
description = "A Python library for preliminary interplanetary trajectory design and multi-gravity-assist mission planning"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Ishaan Sharma" },
]
dependencies = [
    "numpy>=1.26,<2.0",
	"scipy>=1.10.0",
    "astropy>=5.0"
]

[project.optional-dependencies]
dev = [
    "pre_commit>=4.6.2",
    "commitlint>=2.0.0",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.hatch.build.targets.wheel]
packages = ["src/polaris"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests requiring external API or database services",
]

[tool.coverage.run]
source = ["src"]
branch = true

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "NPY"]
# E/F: pyflakes+pycodestyle, I: import order, N: naming (PEP8), UP: modernize
# B: bugbear (common bug patterns), A: shadowed builtins, C4: comprehensions,
# SIM: simplifiable code, NPY: numpy-specific gotchas (e.g. np.bool8 deprecation)

[tool.mypy]
python_version = "3.10"
strict = true
warn_unreachable = true
disallow_untyped_defs = true
